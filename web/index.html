<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Aarogya Next-Gen Hospital & Healthcare Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aarogya">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aarogya Healthcare Platform</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="recaptcha-container"></div>
  <script>
    (function() {
      var BUILD_VERSION = 'v_20260917_1700';

      // 1. Force unregister any active or legacy service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }

      // 2. Clear all browser CacheStorage instances (flutter-app-cache, etc.)
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }

      // 3. One-time version migration reload for clients with stale cache
      var cachedVersion = localStorage.getItem('aarogya_build_tag');
      if (cachedVersion !== BUILD_VERSION) {
        localStorage.setItem('aarogya_build_tag', BUILD_VERSION);
        if (cachedVersion !== null) {
          window.location.reload();
          return;
        }
      }

      // 4. Dynamically inject flutter_bootstrap.js with cache-buster parameter
      var bootstrapScript = document.createElement('script');
      bootstrapScript.src = 'flutter_bootstrap.js?v=' + BUILD_VERSION;
      bootstrapScript.async = true;
      document.body.appendChild(bootstrapScript);
    })();
  </script>
</body>
</html>
